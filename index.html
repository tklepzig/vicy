<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#782222" />
    <meta
      name="viewport"
      content="user-scalable=yes, initial-scale=1.0, maximum-scale=10.0, width=device-width"
    />
    <title>Vicy</title>
    <link href="style.min.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js");
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="panel">
        <header></header>
        <article>
          <div class="key-collapsible" id="key-collapsible">
            <div class="key-collapsible-inner">
              <div class="key-row">
                <input
                  class="input"
                  id="key"
                  type="password"
                  placeholder="Key: .*{2,}"
                  autocomplete="off"
                />
                <input
                  class="input"
                  id="key-confirm"
                  type="password"
                  placeholder="Confirm Key"
                  autocomplete="off"
                />
                <span class="key-hint" id="key-hint" hidden></span>
              </div>
            </div>
          </div>
          <div class="workspace">
            <div class="tile">
              <header></header>
              <article>
                <textarea
                  id="text"
                  spellcheck="false"
                  autocomplete="off"
                  placeholder="Text"
                ></textarea>
              </article>
              <footer>
                <span class="tile-hint" id="text-hint" hidden></span>
              </footer>
            </div>
            <div class="mode-toggle">
              <div class="compound-commands">
                <div class="spacer"></div>
                <button
                  class="command shade2"
                  id="key-toggle-btn"
                  type="button"
                >
                  Key
                </button>
                <div class="spacer flex"></div>
                <button
                  class="command is-active"
                  id="encrypt-btn"
                  type="button"
                  data-label="Encrypt"
                  data-abbr="Enc"
                ></button>
                <button
                  class="command"
                  id="decrypt-btn"
                  type="button"
                  data-label="Decrypt"
                  data-abbr="Dec"
                ></button>
                <div class="spacer flex"></div>
                <div class="spacer"></div>
                <button class="command shade1" id="copy-btn" type="button" hidden>
                  Copy
                </button>
                <div class="spacer"></div>
              </div>
            </div>
            <div class="tile">
              <header></header>
              <article>
                <textarea
                  id="cipher"
                  spellcheck="false"
                  autocomplete="off"
                  placeholder="Cipher"
                ></textarea>
              </article>
              <footer>
                <span class="tile-hint" id="cipher-hint" hidden></span>
              </footer>
            </div>
          </div>
        </article>
        <footer></footer>
      </div>
    </div>

    <script type="module" src="ui.js"></script>
  </body>
</html>
